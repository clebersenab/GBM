<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
<script>
/* Diagnóstico: abra com ?debug no endereço (antes do #) para ver na tela os erros de JavaScript e a versão do navegador. */
(function(){if(location.search.indexOf("debug")<0)return;var L=[];function show(m){L.push(m);var b=document.getElementById("dbg");if(!b){b=document.createElement("pre");b.id="dbg";b.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;max-height:40vh;overflow:auto;background:#300;color:#fff;font:12px/1.4 monospace;padding:10px;border-radius:8px;white-space:pre-wrap;pointer-events:none";(document.body||document.documentElement).appendChild(b)}b.textContent=L.join("\n")}
window.addEventListener("error",function(e){show("ERRO: "+e.message+" ("+(e.filename||"").split("/").pop()+":"+e.lineno+")")});
window.addEventListener("unhandledrejection",function(e){show("PROMESSA: "+(e.reason&&e.reason.message||e.reason))});
window.addEventListener("load",function(){show("ok. "+navigator.userAgent+" | tela "+innerWidth+"x"+innerHeight+" | cqw:"+(window.CSS&&CSS.supports("width:1cqw"))+" | toque:"+document.documentElement.classList.contains("toque")+" ponteiro grosso:"+matchMedia("(pointer:coarse)").matches+" | 100vh="+(function(){var d=document.createElement("div");d.style.height="100vh";document.body.appendChild(d);var h=d.offsetHeight;d.remove();return h})())})})();
</script>

<script>try{if(navigator.maxTouchPoints>1||"ontouchend" in document)document.documentElement.classList.add("toque")}catch(e){}</script>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
// iPad/iPhone: ao girar a tela, o Safari e o Chrome do iPad podiam ampliar a página e não voltar.
// O Chrome do iPad ignora o limite de escala (maximum-scale) por acessibilidade; por isso, depois de cada giro,
// se a página ficou ampliada sem a pessoa ter pedido, reescrevemos a escala para forçar a volta a 1.
// Com ?debug no endereço, cada giro mostra a escala e a largura medidas.
(function(){var m=document.querySelector('meta[name="viewport"]');if(!m||!/iP(ad|hone|od)|Macintosh/.test(navigator.userAgent)||!("ontouchend" in document))return;
var B="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1";m.setAttribute("content",B);
var dbg=location.search.indexOf("debug")>=0;
function info(t){if(!dbg)return;var vv=window.visualViewport,b=document.getElementById("dbg");var s=t+": tela "+innerWidth+"x"+innerHeight+" escala "+(vv?vv.scale.toFixed(2):"?")+" doc "+document.documentElement.scrollWidth;if(b)b.textContent+="\n"+s;else console.log(s)}
function fix(t){var vv=window.visualViewport;info(t);if(vv&&Math.abs(vv.scale-1)>0.01){m.setAttribute("content","width=device-width,initial-scale=1.001,minimum-scale=1,maximum-scale=1");setTimeout(function(){m.setAttribute("content",B);window.scrollTo(0,window.scrollY);setTimeout(function(){info("corrigido")},150)},40)}}
window.addEventListener("orientationchange",function(){setTimeout(function(){fix("giro")},350);setTimeout(function(){fix("giro+1s")},1000)});})();
</script>

    <title>GBM - Histórias para ler juntos</title>
    <link rel="icon" href="/images/marca/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>try{var t=localStorage.getItem('gbm-tema-app');if(t==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
