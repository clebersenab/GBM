<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
<script>
/* Diagnóstico: abra com ?debug no endereço (antes do #) para ver na tela os erros de JavaScript e a versão do navegador. */
(function(){if(location.search.indexOf("debug")<0)return;var L=[];function show(m){L.push(m);var b=document.getElementById("dbg");if(!b){b=document.createElement("pre");b.id="dbg";b.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;max-height:40vh;overflow:auto;background:#300;color:#fff;font:12px/1.4 monospace;padding:10px;border-radius:8px;white-space:pre-wrap;pointer-events:none";(document.body||document.documentElement).appendChild(b)}b.textContent=L.join("\n")}
window.addEventListener("error",function(e){show("ERRO: "+e.message+" ("+(e.filename||"").split("/").pop()+":"+e.lineno+")")});
window.addEventListener("unhandledrejection",function(e){show("PROMESSA: "+(e.reason&&e.reason.message||e.reason))});
window.addEventListener("load",function(){show("ok. "+navigator.userAgent+" | tela "+innerWidth+"x"+innerHeight+" | cqw:"+(window.CSS&&CSS.supports("width:1cqw"))+" | 100vh="+(function(){var d=document.createElement("div");d.style.height="100vh";document.body.appendChild(d);var h=d.offsetHeight;d.remove();return h})())})})();
</script>

    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
/* iPad/iPhone: ao girar a tela, o Safari às vezes mantém o zoom anterior e a página parece ampliada.
   Trava a escala em 1 por um instante na rotação e depois libera (o zoom com dois dedos continua funcionando). */
(function(){var m=document.querySelector('meta[name="viewport"]');if(!m||!/iP(ad|hone|od)|Macintosh/.test(navigator.userAgent)||!("ontouchend" in document))return;var base=m.getAttribute("content");
function gira(){m.setAttribute("content",base+",maximum-scale=1");setTimeout(function(){m.setAttribute("content",base)},400)}
var deitado=innerWidth>innerHeight;window.addEventListener("orientationchange",gira);window.addEventListener("resize",function(){var d=innerWidth>innerHeight;if(d!==deitado){deitado=d;gira()}})})();
</script>

    <title>GBM - Histórias para ler juntos</title>
